# WP1 version catalog. All versions pinned; each supports minSdk 24.
# Media3 1.5.1: minSdk 21 (release commit), Apache-2.0.
# Room 2.6.1: minSdk 21 at this version, Apache-2.0.
# Coil 2.6.0: minSdk 21, Apache-2.0/MIT.
# Compose BOM 2024.09.00, coroutines 1.9.0, serialization 1.7.3: Apache-2.0.
# androidx.test runner + junit-ext (WP4, user-approved): Apache-2.0, test-only.
# kotlinx-coroutines-test (VC5, test-only): same Apache-2.0 license and
# 1.9.0 pin as the coroutines stack; never ships in either APK, so no
# minSdk or license-scan impact. Gives UnrenderedReaderViewModelTest
# virtual time (StandardTestDispatcher plus runTest) for the debounce.
# sherpa-onnx 1.13.8 via JitPack (VC1: full flavor only via
# fullImplementation, so core builds with zero sherpa/onnxruntime/espeak
# files; core is the main Apache-2.0 release, full ships GPL-3.0 per D-126):
# AAR minSdk 21, POM Apache-2.0; native libs bundle static espeak-ng
# (see Slice7.md research) (D-126: option A - full ships GPL-3.0).
# jsoup 1.23.2 (Slice 9 IN4, user-approved per D-079): MIT (POM license
# block + https://jsoup.org/license). Java 8 base with a Java 11 overlay
# (multi-release jar); its POM validates the Java 8 and Android API 21
# surfaces (animal-sniffer check-java8-api + check-android21-api), so
# minSdk 24 is above the validated baseline. Self-contained, no required
# runtime deps (re2j is optional, not transitive). Android projects must
# enable core library desugaring with the NIO spec
# (https://jsoup.org/download); the desugar artifact below provides it.
# desugar_jdk_libs_nio 2.1.5 (Slice 9 IN4, build-time only for the jsoup
# pin): GPL-2.0 with the Classpath Exception (its POM license block); the
# exception permits bundling the desugared classes into the Apache-2.0
# Player (same basis as every desugared app). Not a runtime dependency:
# used via coreLibraryDesugaring only. Latest 2.1.x on 2026-10-06 per
# Google Maven metadata; needs device test for import (IN10).
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
compileSdk = "36"
minSdk = "24"
targetSdk = "36"
media3 = "1.5.1"
room = "2.6.1"
serialization = "1.7.3"
coroutines = "1.9.0"
coil = "2.6.0"
composeBom = "2024.09.00"
activityCompose = "1.9.3"
junit = "4.13.2"
turbine = "1.2.1"
mockk = "1.13.12"
test-runner = "1.6.2"
test-junit-ext = "1.2.1"
sherpa-onnx = "1.13.8"
jsoup = "1.23.2"
desugar-nio = "2.1.5"

[libraries]
