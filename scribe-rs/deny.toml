# cargo-deny policy (Slice 15, S15-7 plus D-144): only these licenses in the
# dependency tree. Scribe itself stays AGPL-3.0-or-later; that is the
# workspace license, not a third-party dependency. Unused allowances are
# dropped (re-add alongside the dependency that needs them).
[licenses]
allow = [
    "AGPL-3.0-or-later", # our own workspace crates (deny graphs members too)
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # was target-lexicon via Tauri; kept while deny passes
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause", # arrayref via the GUI stacks (permissive, tiny)
    "BSL-1.0", # Boost license: clipboard-win + error-code (Windows clipboard stack)
    "OFL-1.1", # font data inside epaint_default_fonts (egui's bundled fonts)
    "Ubuntu-font-1.0", # same crate, same reason
    "ISC", # libloading (permissive; the rustls-stack ISCs left with TLS)
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # MPL-2.0: file-level copyleft in webview stacks (was Tauri's cssparser,
    # selectors and friends); compatible with AGPL-3.0-or-later, never
    # modified here, so the copyleft stays inside its own files.
    "MPL-2.0",
]

[advisories]
# Unmaintained lint covers our own workspace crates only. Transitive
# neglect (was proc-macro-error via Tauri's tree) is out of scope; it
# resurfaces for review on every dependency upgrade.
unmaintained = "workspace"
