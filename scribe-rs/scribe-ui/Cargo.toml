[package]
name = "scribe-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# UI2: egui won the spike (D-159); iced + Slint removed with their bins.
# scribe-client stays: Slice 17 wires it (helper lifecycle + Books).
scribe-client = { path = "../scribe-client" }
egui = "0.36"
eframe = "0.36"
# AP2: native add-book dialog (owner-approved; MIT, deny-checked).
rfd = "0.17"
# AP3: cast/detail JSON + fixture parsing (owner-approved; same as client's).
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Slice 20 TR1 (owner-approved): bundle zip (Stored) + tablet push + sha256.
# ureq mirrors scribe-client (same version, same multipart feature).
# MM1 (owner-approved 2026-10-15): `native-tls-no-default` for model
# downloads over HTTPS (Windows system TLS + OS cert store, no bundled
# roots; the `rustls` bundle failed the deny gate on webpki-roots
# CDLA-Permissive-2.0, and Linux builds will need OpenSSL headers).
ureq = { version = "3", default-features = false, features = ["multipart", "native-tls-no-default"] }
# AC 2026-10-18 (D-182, owner-approved): zip 2.4.2 carried advisory
# GHSA-4684-h2q9-2vcp, so zip moved to 9. Bundles are written Stored
# only, so the codec backends stay off: zip 9's defaults pull bzip2
# (bzip2-1.0.6, not on the deny allow-list) for nothing we use.
zip = { version = "9", default-features = false }
sha2 = "0.10"
# CS3: audition playback (owner-approved D-162; MIT OR Apache-2.0, deny green).
# wav-only: the helper serves clips as wav, so no mp3/flac/vorbis decoders.
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
