[project]
name = "auloud-scribe"
version = "0.1.0"
description = "Auloud Scribe: turn ebooks into multi-voice audiobooks (PC tool)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "typer",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "pysbd",
    "pyyaml>=6.0.3",
    "kokoro-onnx>=0.6.1",
    "piper-tts>=1.8.0",
    # D-185: GPU is the default TTS runtime on Windows, the CPU is the
    # fallback. `onnxruntime-gpu` must be the CUDA 12 feed build (see
    # [tool.uv.sources] below); the four NVIDIA wheels are the runtime DLLs
    # its CUDA provider dlopens at session load. On a machine where the
    # provider cannot load, `--device auto` warns on stderr and continues on
    # the CPU (D-177), so the fallback is automatic and visible. Other
    # platforms use the plain CPU wheel.
    "onnxruntime-gpu==1.29.0; sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.27.0.42; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'win32'",
    "onnxruntime>=1.30.0; sys_platform != 'win32'",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "rich>=15.0.0",
    "spacy>=3.8.16,<4",
    "en-core-web-sm",
    "pymupdf>=1.28.2",
]

[project.scripts]
scribe = "scribe.cli:app"

[project.optional-dependencies]
# Slice 6 UI2 (D2): localhost web UI. Optional so the plain CLI install stays
# light; the `scribe ui` command lazy-imports it with a friendly hint when
# missing. Licenses checked 2026-10-04 via the PyPI JSON API (all permissive,
# AGPL-compatible inside Scribe; none ships in the Player): fastapi MIT,
# uvicorn BSD-3-Clause, starlette BSD-3-Clause, python-multipart Apache-2.0,
# pydantic MIT. Floors satisfy fastapi's own requirements
# (starlette>=0.46, pydantic>=2.9, python-multipart>=0.0.18).
ui = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "starlette>=0.46.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat source tree (per 05-ScribeDesign.md) is remapped into the `scribe`
# namespace on install, so generic names (extract/text/...) never land as
# top-level site-packages. No directory moves; dev (`uv run`) keeps working
# from the source tree.
packages = []

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "scribe/cli.py"
"__main__.py" = "scribe/__main__.py"
"draft.py" = "scribe/draft.py"
"build.py" = "scribe/build.py"
"lock.py" = "scribe/lock.py"
"proc.py" = "scribe/proc.py"
"progress.py" = "scribe/progress.py"
"selection.py" = "scribe/selection.py"
"device.py" = "scribe/device.py"
"export_ingest.py" = "scribe/export_ingest.py"
"export_render.py" = "scribe/export_render.py"
"export_timing.py" = "scribe/export_timing.py"
"extract" = "scribe/extract"
"text" = "scribe/text"
"tts" = "scribe/tts"
"audio" = "scribe/audio"
"bundle" = "scribe/bundle"
"ui" = "scribe/ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs real Kokoro models (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.uv]
# D-185: `kokoro-onnx` and `piper-tts` require the CPU `onnxruntime` distribution,
# which owns the same `onnxruntime` module as `onnxruntime-gpu`: installed
# together, the CPU build wins whichever way the file writes land, and CUDA
# silently disappears from `get_available_providers()`. This override keeps the
# requirement off Windows (so only the CUDA 12 build is installed there) and
# leaves it untouched elsewhere, where it is the CPU fallback.
override-dependencies = [
    "onnxruntime; sys_platform != 'win32'",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# D-185: pin onnxruntime-gpu to ONNX Runtime's CUDA 12 feed. PyPI publishes the
# same version number as a CUDA 13 build, which fails to load on this
# laptop's driver while `get_available_providers()` still lists CUDA (D-176).
# A source pinned to an index excludes every other index for that package, so
# no --extra-index-url or --index-strategy flag is needed.
onnxruntime-gpu = { index = "onnxruntime-cuda12" }

[[tool.uv.index]]
name = "onnxruntime-cuda12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true
