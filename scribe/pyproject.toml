[project]
name = "auloud-scribe"
version = "0.1.0"
description = "Auloud Scribe: turn ebooks into multi-voice audiobooks (PC tool)"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "typer",
]

[project.scripts]
scribe = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extract", "text", "tts", "audio", "bundle"]
include = ["cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
